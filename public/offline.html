<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3a2a" />
    <title>SOUQ Offline</title>
    <style>
      :root {
        color: #1a3a2a;
        background: #f8f5ef;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 28rem;
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
      }

      p {
        margin: 0;
        color: rgb(26 58 42 / 70%);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192x192.png" alt="SOUQ" />
      <h1>SOUQ is offline</h1>
      <p>Reconnect to refresh products and sales data. Recently loaded app assets remain available.</p>
    </main>
  </body>
</html>
